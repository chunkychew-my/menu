<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chunky Chew | Pre-Order</title>
    
    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #4A76CF;
            --bg-cream: #FFFBF0;
        }

        body {
            background-color: var(--bg-cream);
            font-family: 'Poppins', sans-serif;
            color: var(--brand-blue);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .font-bold {
            font-weight: 700 !important;
        }

        /* --- CALENDAR CROP FIX --- */
        .flatpickr-calendar {
            width: 300px !important;
            max-width: 92vw !important;
            margin-bottom: 20px !important; /* Forces breathing room at bottom */
            box-shadow: 0 10px 25px rgba(0,0,0,0.05) !important;
            border: 0 !important;
        }
        
        .flatpickr-innerContainer {
            padding-bottom: 10px !important; /* Prevents last row crop */
        }

        .flatpickr-day.selected {
            background: var(--brand-blue) !important;
            border-color: var(--brand-blue) !important;
        }

        /* --- HORIZONTAL CARD FIX --- */
        .cookie-card {
            background: white;
            border: 1px solid rgba(74, 118, 207, 0.1);
            display: flex;
            flex-direction: row; /* Always horizontal */
            align-items: center;
            padding: 12px;
            gap: 16px;
        }

        .img-square {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        @media (min-width: 640px) {
            .img-square { width: 120px; height: 120px; }
        }

        .item-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #f4f4f4;
        }

        .qty-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--brand-blue);
            color: var(--brand-blue);
            font-size: 1.1rem;
            background: transparent;
        }

        .qty-btn:active {
            background: var(--brand-blue);
            color: white;
        }

        input, textarea {
            background: white !important;
            border: 1.5px solid rgba(74, 118, 207, 0.15) !important;
            padding: 12px 14px !important;
            border-radius: 10px !important;
            color: var(--brand-blue) !important;
            width: 100%;
        }

        #confirmation-screen { display: none; }
        .logo-box { max-width: 180px; margin: 0 auto; }
    </style>
</head>
<body class="p-4 md:p-12">

    <div id="main-app" class="max-w-xl mx-auto">
        
        <!-- Logo Header -->
        <header class="text-center mb-10">
            <div class="logo-box">
                <img src="logo.png" alt="Chunky Chew" class="w-full h-auto" onerror="this.onerror=null; this.src='https://via.placeholder.com/180x70?text=Chunky+Chew';">
            </div>
        </header>

        <!-- Menu: Photos Left, Text Right -->
        <section class="mb-8">
            <h2 class="text-lg mb-6 uppercase tracking-[0.2em] text-center opacity-60">Menu</h2>
            <div class="space-y-4">
                
                <!-- Item 1 -->
                <div class="cookie-card rounded-2xl shadow-sm">
                    <div class="img-square">
                        <img src="og.jpg" alt="OG Chunk" class="item-img" onerror="this.src='https://via.placeholder.com/150?text=OG';">
                    </div>
                    <div class="flex-grow flex flex-col justify-between h-full">
                        <div>
                            <h3 class="text-lg leading-tight">OG Chunk</h3>
                            <p class="text-sm font-bold opacity-60">RM 9.50</p>
                        </div>
                        <div class="flex items-center gap-5 mt-2">
                            <button onclick="updateQty('og', -1)" class="qty-btn">−</button>
                            <span id="qty-og" class="font-bold text-lg w-4 text-center">0</span>
                            <button onclick="updateQty('og', 1)" class="qty-btn">+</button>
                        </div>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="cookie-card rounded-2xl shadow-sm">
                    <div class="img-square">
                        <img src="nutella.jpg" alt="Nutella" class="item-img" onerror="this.src='https://via.placeholder.com/150?text=Nutella';">
                    </div>
                    <div class="flex-grow flex flex-col justify-between h-full">
                        <div>
                            <h3 class="text-lg leading-tight">Gooey Nutella</h3>
                            <p class="text-sm font-bold opacity-60">RM 11.00</p>
                        </div>
                        <div class="flex items-center gap-5 mt-2">
                            <button onclick="updateQty('nutella', -1)" class="qty-btn">−</button>
                            <span id="qty-nutella" class="font-bold text-lg w-4 text-center">0</span>
                            <button onclick="updateQty('nutella', 1)" class="qty-btn">+</button>
                        </div>
                    </div>
                </div>

                <!-- Item 3 -->
                <div class="cookie-card rounded-2xl shadow-sm">
                    <div class="img-square">
                        <img src="smores.jpg" alt="Smores" class="item-img" onerror="this.src='https://via.placeholder.com/150?text=Smores';">
                    </div>
                    <div class="flex-grow flex flex-col justify-between h-full">
                        <div>
                            <h3 class="text-lg leading-tight">Toasty S'mores</h3>
                            <p class="text-sm font-bold opacity-60">RM 11.00</p>
                        </div>
                        <div class="flex items-center gap-5 mt-2">
                            <button onclick="updateQty('smores', -1)" class="qty-btn">−</button>
                            <span id="qty-smores" class="font-bold text-lg w-4 text-center">0</span>
                            <button onclick="updateQty('smores', 1)" class="qty-btn">+</button>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Summary -->
        <div class="bg-white p-5 rounded-2xl mb-8 flex justify-between items-center border border-blue-50 shadow-sm">
            <span class="text-xs uppercase tracking-widest opacity-40 font-bold">Subtotal</span>
            <span id="total-price" class="text-2xl font-bold">RM 0.00</span>
        </div>

        <!-- Form -->
        <section class="bg-white p-6 rounded-[2rem] shadow-sm border border-blue-50">
            <h2 class="text-center text-lg uppercase tracking-widest mb-6 opacity-60">Pre-Order Form</h2>
            <form id="orderForm" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1">Full Name</label>
                    <input type="text" id="name" required placeholder="Enter name">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1">WhatsApp Number</label>
                    <input type="tel" id="phone" required placeholder="0123456789">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1">Select Friday</label>
                    <input type="text" id="pickup-date" placeholder="Choose a date" readonly required class="cursor-pointer">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1">Notes (Optional)</label>
                    <textarea id="notes" rows="2" placeholder="Any requests?"></textarea>
                </div>

                <button type="submit" class="w-full bg-[#4A76CF] text-white font-bold py-4 rounded-xl text-md mt-2 uppercase tracking-widest shadow-md active:scale-95 transition-all">
                    Next Step
                </button>
            </form>
        </section>

        <footer class="mt-12 text-center opacity-30 text-[9px] pb-10 uppercase tracking-[0.4em]">
            &copy; 2026 Chunky Chew
        </footer>
    </div>

    <!-- Confirmation Screen -->
    <div id="confirmation-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center p-6">
        <div class="max-w-md w-full text-center">
            <h2 class="text-3xl font-bold mb-6">Confirm Order</h2>
            <div class="bg-[#F8F9FF] p-6 rounded-[2rem] text-left mb-6 border border-blue-50">
                <div id="conf-summary" class="space-y-3 mb-4 border-b border-blue-100 pb-4 text-sm"></div>
                <div class="flex justify-between font-bold text-xl mb-6">
                    <span>Total</span>
                    <span id="conf-total">RM 0.00</span>
                </div>
                <div class="p-3 bg-white rounded-xl border border-blue-100">
                    <p class="text-[9px] uppercase font-bold opacity-40 mb-0.5">Collection Date</p>
                    <p id="conf-date" class="font-bold text-md"></p>
                </div>
            </div>
            
            <button id="wa-btn" class="w-full bg-[#25D366] text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 shadow-lg">
                Send to WhatsApp
            </button>
            <button onclick="window.location.reload()" class="mt-8 text-[10px] font-bold opacity-30 underline uppercase tracking-widest">Back to Menu</button>
        </div>
    </div>

    <script>
        const menu = {
            og: { name: "OG Chunk", price: 9.50, qty: 0 },
            nutella: { name: "Gooey Nutella", price: 11.00, qty: 0 },
            smores: { name: "Toasty S'mores", price: 11.00, qty: 0 }
        };

        function updateQty(id, change) {
            const item = menu[id];
            if (item.qty + change >= 0) {
                item.qty += change;
                document.getElementById(`qty-${id}`).innerText = item.qty;
                const total = Object.values(menu).reduce((acc, i) => acc + (i.qty * i.price), 0);
                document.getElementById('total-price').innerText = `RM ${total.toFixed(2)}`;
            }
        }

        // FRIDAY-ONLY with Crop Fix Logic
        flatpickr("#pickup-date", {
            minDate: "today",
            dateFormat: "l, d F Y",
            disableMobile: "true",
            static: true, // Calendar appears below input, helps with height calculation
            "enable": [function(date) { return (date.getDay() === 5); }]
        });

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const total = Object.values(menu).reduce((acc, i) => acc + (i.qty * i.price), 0);
            if (total <= 0) return alert("Please add at least one cookie!");

            document.getElementById('conf-total').innerText = `RM ${total.toFixed(2)}`;
            document.getElementById('conf-date').innerText = document.getElementById('pickup-date').value;

            let summaryHtml = '';
            let waItems = '';
            for (const key in menu) {
                if (menu[key].qty > 0) {
                    summaryHtml += `<div class="flex justify-between"><span>${menu[key].qty}x ${menu[key].name}</span><span>RM ${(menu[key].qty * menu[key].price).toFixed(2)}</span></div>`;
                    waItems += `%0A- ${menu[key].qty}x ${menu[key].name}`;
                }
            }
            document.getElementById('conf-summary').innerHTML = summaryHtml;
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('confirmation-screen').style.display = 'flex';
            window.scrollTo(0,0);

            document.getElementById('wa-btn').onclick = () => {
                const name = document.getElementById('name').value;
                const date = document.getElementById('pickup-date').value;
                const notes = document.getElementById('notes').value || "None";
                const msg = `*NEW PRE-ORDER*%0A*Name:* ${name}%0A*Date:* ${date}%0A%0A*Items:*${waItems}%0A%0A*Total:* RM ${total.toFixed(2)}%0A%0A*Notes:* ${notes}`;
                window.open(`https://wa.me/60183661132?text=${msg}`, '_blank');
            };
        });
    </script>
</body>
</html>
